name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.

  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: |
        RemoteKSP guards signing keys. Does this change who can sign, what is exposed on the network,
        or how credentials are stored? Leave empty if unsure.
