name: Scorecard

# OpenSSF Scorecard: checks supply-chain practices (branch protection, pinned dependencies,
# token permissions, …), shows the results under Security → Code scanning and publishes
# the score for the README badge.
on:
  push:
    branches: [master]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the SARIF results
      id-token: write          # publish the results to the OpenSSF API for the badge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
